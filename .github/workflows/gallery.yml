name: Build gallery

# Runs when gallery photos (or this pipeline) change on main, and can also be
# launched by hand from the Actions tab.
on:
  push:
    branches: [main]
    paths:
      - "gallery/**"
      - "scripts/build_gallery.py"
      - ".github/workflows/gallery.yml"
  workflow_dispatch: {}

# Lets the job commit the regenerated manifest / compressed images back.
# Pushes made with this token do NOT re-trigger the workflow, so there's no loop.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow
        run: pip install Pillow

      - name: Build manifest + compress images
        run: python3 scripts/build_gallery.py

      - name: Commit changes (if any)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add gallery
          if git diff --cached --quiet; then
            echo "Nothing changed — manifest already up to date."
          else
            git commit -m "chore(gallery): rebuild manifest and compress images"
            git push
          fi
